# ===== CONFIGURAÇÃO NGINX PARA PRODUÇÃO - MOVASE BACKEND =====

events {
    worker_connections 1024;
}

http {
    # ===== CONFIGURAÇÕES BÁSICAS =====
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # ===== LOGS =====
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # ===== PERFORMANCE =====
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # ===== GZIP =====
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # ===== RATE LIMITING =====
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    
    # ===== UPSTREAM BACKEND =====
    upstream movase_backend {
        server movase-backend:3001;
        keepalive 32;
    }
    
    # ===== SERVER HTTP (REDIRECIONAMENTO PARA HTTPS) =====
    server {
        listen 80;
        server_name api.movase.com;
        
        # Redirecionar para HTTPS
        return 301 https://$server_name$request_uri;
    }
    
    # ===== SERVER HTTPS =====
    server {
        listen 443 ssl http2;
        server_name api.movase.com;
        
        # ===== SSL/TLS =====
        ssl_certificate /etc/nginx/ssl/movase.crt;
        ssl_certificate_key /etc/nginx/ssl/movase.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # ===== HEADERS DE SEGURANÇA =====
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        
        # ===== CLIENT MAX BODY SIZE =====
        client_max_body_size 10M;
        
        # ===== ROTAS DA API =====
        location /api/ {
            # Rate limiting
            limit_req zone=api burst=20 nodelay;
            
            # Proxy para o backend
            proxy_pass http://movase_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            
            # Headers específicos da API
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
            
            # Tratar preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }
        }
        
        # ===== ROTA DE LOGIN (RATE LIMITING ESPECIAL) =====
        location /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            
            proxy_pass http://movase_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ===== ROTA DE REGISTRO (RATE LIMITING ESPECIAL) =====
        location /api/auth/register {
            limit_req zone=login burst=3 nodelay;
            
            proxy_pass http://movase_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ===== UPLOADS =====
        location /uploads/ {
            alias /var/www/uploads/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            
            # Segurança para uploads
            location ~* \.(php|php3|php4|php5|phtml|pl|py|jsp|asp|sh|cgi)$ {
                deny all;
            }
        }
        
        # ===== HEALTH CHECK =====
        location /health {
            access_log off;
            proxy_pass http://movase_backend;
            proxy_set_header Host $host;
        }
        
        # ===== DOCUMENTAÇÃO SWAGGER =====
        location /api-docs {
            proxy_pass http://movase_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ===== BLOQUEAR ARQUIVOS SENSÍVEIS =====
        location ~ /\. {
            deny all;
        }
        
        location ~* \.(env|log|sql|bak|backup)$ {
            deny all;
        }
        
        # ===== PÁGINA DE ERRO 404 =====
        location / {
            return 404;
        }
    }
}
